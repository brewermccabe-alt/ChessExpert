<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Opening Trainer</title>
  <meta name="description" content="Free, offline chess opening repertoire builder and spaced-repetition trainer.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'><rect width='8' height='8' fill='%23b58863'/><rect width='4' height='4' fill='%23f0d9b5'/><rect x='4' y='4' width='4' height='4' fill='%23f0d9b5'/></svg>">
  <link rel="stylesheet" href="style.css">

<body>
  <header class="topbar">
    <a href="#/" class="brand">♞<span class="brand-name"> Opening Trainer</span></a>

      <a href="#/">Openings</a>
      <a href="#/puzzles">Puzzles</a>
      <a href="#/help"><span class="long">How it works</span><span class="short">Help</span></a>
      <div class="volume">

  </header>
  <main id="app"></main>
  <div id="modal-root"></div>

  <script src="vendor/chess.js"></script>
  <script src="js/pieces.js"></script>

  <script src="js/board.js"></script>
  <script src="js/repertoire.js"></script>
  <script src="js/trainer.js"></script>

</html>
